name: WebKit worker stage probe

on:
  push:
    branches:
      - codex/webkit-worker-stage-probe-ci
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build:portable
      - run: npx playwright install webkit
      - name: Run portable WebKit with worker stage logs
        run: npm run test:e2e:portable -- --project=webkit
