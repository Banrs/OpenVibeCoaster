name: Diagnose Vitest shards

on:
  push:
    branches:
      - codex/ci-shard-diagnostic

permissions:
  contents: read

concurrency:
  group: diagnose-vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  case:
    name: diagnose-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: simulation
            file: apps/web/src/engineering/simulation.test.ts
            test: flagship 1.6-2.2km
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Install exact dependencies
        run: npm ci
      - name: Run diagnostic case
        run: >-
          npm run test --
          ${{ matrix.file }}
          -t "${{ matrix.test }}"
          --reporter=verbose
          --testTimeout=120000
          --hookTimeout=120000
