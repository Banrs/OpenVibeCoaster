name: Targeted record Task02 GREEN

on:
  push:
    branches:
      - codex/record-task02-green-ci
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify record semantic and top-hat geometry contracts
        run: >-
          npm run test --
          packages/generator/src/elements-record.test.ts
          packages/generator/src/coaster-file-record-kinds.test.ts
          packages/generator/src/topHat-height.geometry.test.ts
          packages/core/src/coaster-file.test.ts
      - name: Verify engineering package types
        run: npm run typecheck -w @openvibecoaster/core && npm run typecheck -w @openvibecoaster/generator
