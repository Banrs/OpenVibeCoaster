name: Targeted heightfield maximum-y RED

on:
  push:
    branches:
      - codex/heightfield-certified-maxy-red-ci
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove maximum-y capability is RED
        run: >-
          npm run test --
          packages/core/src/environment-certified-bounds.test.ts
          packages/generator/src/clearance-field.heightfield-fastproof.test.ts
