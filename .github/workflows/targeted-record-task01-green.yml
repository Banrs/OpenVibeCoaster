name: Targeted record Task01 GREEN

on:
  push:
    branches:
      - codex/record-task01-green-ci
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the record snapshot and profile contracts
        run: >-
          npm run test --
          packages/core/src/record-snapshot.test.ts
          packages/core/src/record-targets.test.ts
      - name: Verify the core package types
        run: npm run typecheck -w @openvibecoaster/core
