name: Format terrain artifact

on:
  push:
    branches:
      - codex/terrain-invariants-green-ci

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Apply pinned Prettier
        run: npx prettier --write packages/generator/src/clearance-field.terrain-invariants.test.ts
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: terrain-invariants-prettier
          path: packages/generator/src/clearance-field.terrain-invariants.test.ts
          if-no-files-found: error
