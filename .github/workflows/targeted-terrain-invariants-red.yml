name: Targeted terrain invariants RED

on:
  push:
    branches:
      - codex/terrain-invariants-red-ci

permissions:
  contents: read

concurrency:
  group: targeted-terrain-invariants-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Prove terrain invariants regression is RED
        run: npm run test -- packages/generator/src/clearance-field.terrain-invariants.test.ts
