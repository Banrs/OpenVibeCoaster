name: Targeted WebKit clearance RED

on:
  push:
    branches:
      - codex/webkit-clearance-red-ci
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove display-only terrain refinement is RED
        run: npm run test -- packages/generator/src/clearance-field.fastproof.test.ts
