name: Heightfield format artifact

on:
  push:
    branches:
      - codex/heightfield-maxy-format-ci
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed heightfield files
        run: >-
          npx prettier --write
          packages/core/src/contracts.ts
          packages/core/src/environment.ts
          packages/core/src/environment-certified-bounds.test.ts
          packages/generator/src/clearance-field.ts
          packages/generator/src/clearance-field.heightfield-fastproof.test.ts
      - name: Create patch
        run: git diff --binary > heightfield-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: heightfield-format-patch
          path: heightfield-format.patch
          if-no-files-found: error
