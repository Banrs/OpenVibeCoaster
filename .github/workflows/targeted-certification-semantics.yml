name: Targeted clearance certification semantics

on:
  push:
    branches:
      - codex/certification-semantics-ci

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Verify cap, hard, soft, and terrain invariants
        run: >-
          npm run test --
          packages/generator/src/clearance-field.fastproof.test.ts
          packages/generator/src/clearance-field.terrain-hard.test.ts
          packages/generator/src/clearance-threshold-display-soft.test.ts
          packages/generator/src/clearance-field.terrain-invariants.test.ts
          packages/generator/src/clearance-field.terrain-outward.test.ts
