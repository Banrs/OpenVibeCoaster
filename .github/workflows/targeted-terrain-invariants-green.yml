name: Targeted terrain invariants GREEN

on:
  push:
    branches:
      - codex/terrain-invariants-green-ci

permissions:
  contents: read

concurrency:
  group: targeted-terrain-invariants-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Prove terrain invariant optimization is GREEN
        run: >-
          npm run test --
          packages/generator/src/clearance-field.terrain-invariants.test.ts
          packages/generator/src/clearance-field.terrain-hard.test.ts
          packages/generator/src/clearance-field.terrain-outward.test.ts
          packages/generator/src/clearance-field.fastproof.test.ts
