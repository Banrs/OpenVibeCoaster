name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-e2e-bench (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Verify Node 24 and npm 11.17.0
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version)" = "11.17.0"
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Generate canonical formatting patch
        shell: bash
        run: |
          npx prettier --write packages/generator/src/elements.ts packages/generator/src/pipeline.ts packages/generator/src/solver.ts packages/generator/src/recordHybrid.pipeline.test.ts packages/generator/src/recordHybrid.determinism.test.ts packages/generator/src/recordHybrid.physical-length.test.ts
          git diff --binary > task06-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: task06-format-patch
          path: task06-format.patch
      - name: Record-hybrid pipeline
        run: npx vitest run packages/generator/src/recordHybrid.pipeline.test.ts packages/generator/src/recordHybrid.determinism.test.ts packages/generator/src/recordHybrid.physical-length.test.ts

  portable:
    if: false
    name: portable-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 11.17.0
        run: npm install -g npm@11.17.0
      - name: Verify Node 24 and npm 11.17.0 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version)" = "11.17.0"
      - name: Verify Node 24 and npm 11.17.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeVersion = node --version
          $nodeMajor = node -p "process.versions.node.split('.')[0]"
          $npmVersion = npm --version
          Write-Host "Node version: $nodeVersion"
          Write-Host "Node major: $nodeMajor"
          Write-Host "npm version: $npmVersion"
          if ($nodeMajor.Trim() -ne "24") { throw "Expected Node major 24, got $nodeMajor (full $nodeVersion)" }
          if ($npmVersion.Trim() -ne "11.17.0") { throw "Expected npm 11.17.0, got $npmVersion" }
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Build portable artifact
        run: npm run build
      - name: Verify portable artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -f apps/web/dist/OpenVibeCoaster.html
          test -s apps/web/dist/OpenVibeCoaster.html
          ls -lh apps/web/dist/OpenVibeCoaster.html
          echo "Portable artifact verified: apps/web/dist/OpenVibeCoaster.html exists and is non-empty"
      - name: Verify portable artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "apps/web/dist/OpenVibeCoaster.html")) { throw "Missing portable artifact: apps/web/dist/OpenVibeCoaster.html" }
          if ((Get-Item "apps/web/dist/OpenVibeCoaster.html").Length -eq 0) { throw "Portable artifact is empty: apps/web/dist/OpenVibeCoaster.html" }
          Get-ChildItem "apps/web/dist/OpenVibeCoaster.html" | Format-List Name,Length,FullName
          Write-Host "Portable artifact verified: apps/web/dist/OpenVibeCoaster.html exists and is non-empty"
      - name: Install Playwright WebKit (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: npx playwright install --with-deps webkit
      - name: Portable E2E (macOS - WebKit)
        if: runner.os == 'macOS'
        shell: bash
        run: npm run test:e2e:portable -- --project=webkit
      - name: Portable E2E (Windows - Edge)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run test:e2e:portable -- --project=edge
